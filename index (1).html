<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
<title>Lavin's phone</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lavin's phone">
<meta name="theme-color" content="#7A2E3F">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%237A2E3F'/%3E%3Crect x='24' y='16' width='52' height='68' rx='10' fill='%23EFE3CD' stroke='%233A1620' stroke-width='3'/%3E%3Ccircle cx='50' cy='74' r='4' fill='%233A1620'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=VT323&family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --shell:#7A2E3F;
    --shell-dark:#5E2231;
    --shell-darker:#431825;
    --gold:#C9A15A;
    --gold-dark:#AD8646;
    --cream:#F5EBDA;
    --ink:#3A1620;
    --lcd-bg:#EFE3CD;
    --lcd-bg-deep:#E3D3AE;
    --lcd-fg:#4A2030;
    --coral:#B4523F;
    --coral-dark:#963F2F;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:
      radial-gradient(circle at 20% 15%, #FFF7EC 0%, var(--cream) 45%, #F1E4D0 100%);
    font-family:'Baloo 2', sans-serif;
    color:var(--ink);
    min-height:100dvh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:18px;
    overflow:hidden;
  }

  .phone{
    width:100%;
    max-width:380px;
    height:min(780px, 96dvh);
    background: linear-gradient(160deg, var(--shell) 0%, var(--shell-dark) 78%, var(--shell-darker) 100%);
    border-radius:46px;
    padding:20px 18px 24px;
    display:flex;
    flex-direction:column;
    gap:14px;
    box-shadow:
      0 30px 60px -20px rgba(74,52,32,0.45),
      inset 0 2px 0 rgba(255,255,255,0.35),
      inset 0 -6px 14px rgba(0,0,0,0.12);
    position:relative;
  }

  .phone::before{
    content:"";
    position:absolute;
    top:14px; left:50%; transform:translateX(-50%);
    width:70px; height:6px; border-radius:6px;
    background:rgba(74,52,32,0.18);
  }

  .speaker{
    display:flex;
    justify-content:center;
    gap:5px;
    margin-top:14px;
  }
  .speaker span{
    width:5px;height:5px;border-radius:50%;
    background:rgba(74,52,32,0.28);
  }

  .screen{
    flex:1;
    background: linear-gradient(180deg, var(--lcd-bg) 0%, var(--lcd-bg-deep) 100%);
    border-radius:26px;
    border:7px solid var(--ink);
    box-shadow: inset 0 3px 10px rgba(0,0,0,0.25), inset 0 0 0 3px rgba(255,255,255,0.15);
    padding:16px 14px;
    position:relative;
    overflow:hidden;
    color:var(--lcd-fg);
    display:flex;
    flex-direction:column;
  }

  /* subtle scanline texture for LCD feel */
  .screen::after{
    content:"";
    position:absolute; inset:0;
    background:repeating-linear-gradient(
      to bottom,
      rgba(55,69,46,0.05) 0px,
      rgba(55,69,46,0.05) 1px,
      transparent 1px,
      transparent 3px
    );
    pointer-events:none;
  }

  .view{ display:none; flex-direction:column; height:100%; }
  .view.active{ display:flex; }

  /* ---------- Home / status ---------- */
  .carrier{
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size:13px;
    text-align:center;
    opacity:0.7;
    margin-bottom:6px;
  }

  .status-row{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    font-family:'VT323', monospace;
    font-size:17px;
    letter-spacing:0.5px;
    opacity:0.85;
    margin-bottom:2px;
  }

  .clock{
    text-align:center;
    margin:2px 0 10px;
  }
  .clock .time{
    font-family:'VT323', monospace;
    font-size:52px;
    line-height:1;
    letter-spacing:2px;
  }
  .clock .date{
    font-family:'Baloo 2', sans-serif;
    font-weight:600;
    font-size:13px;
    text-transform:capitalize;
    opacity:0.85;
    margin-top:2px;
  }

  .weather-mini{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    font-family:'VT323', monospace;
    font-size:18px;
    margin-bottom:10px;
    opacity:0.9;
  }
  .weather-mini .ic{ font-size:18px; }

  .app-grid{
    flex:1;
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:10px;
    align-content:start;
  }

  .app-key{
    background: rgba(255,255,255,0.35);
    border: 2px solid rgba(55,69,46,0.35);
    border-radius:16px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:4px;
    padding:10px 4px 8px;
    cursor:pointer;
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size:11px;
    color:var(--lcd-fg);
    transition:transform .08s ease, background .15s ease;
    text-align:center;
  }
  .app-key:active{
    transform:scale(0.93);
    background:rgba(255,255,255,0.6);
  }
  .app-key svg{ width:26px; height:26px; }

  /* ---------- Back header for subviews ---------- */
  .subview-header{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:12px;
    font-family:'Baloo 2', sans-serif;
    font-weight:800;
    font-size:16px;
  }
  .subview-header svg{ width:20px; height:20px; }

  /* ---------- Weather view ---------- */
  .weather-big{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    flex:1;
    gap:6px;
  }
  .weather-big .emoji{ font-size:54px; }
  .weather-big .temp{
    font-family:'VT323', monospace;
    font-size:56px;
    line-height:1;
  }
  .weather-big .desc{
    font-family:'Baloo 2', sans-serif;
    font-weight:600;
    font-size:14px;
    text-transform:capitalize;
    opacity:0.85;
  }
  .weather-sub{
    display:flex;
    justify-content:space-around;
    font-family:'VT323', monospace;
    font-size:16px;
    padding-top:10px;
    border-top:2px dashed rgba(55,69,46,0.3);
    margin-top:10px;
  }

  /* ---------- Calculator view ---------- */
  .calc-display{
    font-family:'VT323', monospace;
    font-size:38px;
    text-align:right;
    padding:8px 6px;
    margin-bottom:10px;
    min-height:46px;
    overflow-x:auto;
    white-space:nowrap;
    border-bottom:2px dashed rgba(55,69,46,0.3);
  }
  .calc-grid{
    flex:1;
    display:grid;
    grid-template-columns:repeat(4, 1fr);
    gap:7px;
  }
  .calc-key{
    background:rgba(255,255,255,0.4);
    border:2px solid rgba(55,69,46,0.3);
    border-radius:12px;
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size:16px;
    color:var(--lcd-fg);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
  }
  .calc-key:active{ transform:scale(0.92); background:rgba(255,255,255,0.65); }
  .calc-key.op{ background:rgba(180,82,63,0.35); }
  .calc-key.wide{ grid-column:span 2; }

  /* ---------- Soft keys under screen ---------- */
  .softkeys{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:2px 10px;
  }
  .softkey{
    background:none;
    border:none;
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size:13px;
    color:rgba(74,52,32,0.75);
    padding:6px 4px;
    cursor:pointer;
  }
  .home-btn{
    width:46px; height:46px;
    border-radius:50%;
    background: linear-gradient(160deg, var(--gold) 0%, var(--gold-dark) 100%);
    border:2px solid rgba(74,52,32,0.25);
    box-shadow: inset 0 2px 0 rgba(255,255,255,0.4), 0 3px 6px rgba(0,0,0,0.15);
    cursor:pointer;
  }

  .credit{
    text-align:center;
    font-size:10px;
    color:rgba(74,52,32,0.4);
    margin-top:2px;
  }
</style>
</head>
<body>

<div class="phone">
  <div class="speaker"><span></span><span></span><span></span><span></span><span></span></div>

  <div class="screen">

    <!-- HOME VIEW -->
    <div id="view-home" class="view active">
      <div class="carrier">Lavin's phone</div>
      <div class="status-row">
        <span id="status-time">--:--</span>
        <span id="status-batt">🔋</span>
      </div>
      <div class="clock">
        <div class="time" id="clock-time">--:--</div>
        <div class="date" id="clock-date">-</div>
      </div>
      <div class="weather-mini" id="weather-mini">
        <span class="ic">⛅</span><span id="weather-mini-text">Henter vær …</span>
      </div>

      <div class="app-grid">
        <div class="app-key" data-action="app" data-app="comgooglemaps://" data-url="https://maps.google.com">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s7-7.58 7-13A7 7 0 0 0 5 9c0 5.42 7 13 7 13z"/><circle cx="12" cy="9" r="2.5"/></svg>
          Kart
        </div>

        <div class="app-key" data-action="app" data-app="ruter://" data-url="https://ruter.no">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5" width="16" height="12" rx="2.5"/><path d="M4 12h16"/><circle cx="8" cy="19.5" r="1.4" fill="currentColor" stroke="none"/><circle cx="16" cy="19.5" r="1.4" fill="currentColor" stroke="none"/></svg>
          Ruter
        </div>

        <div class="app-key" data-action="view" data-view="weather">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="9" r="3.2"/><path d="M13 17.5a3.5 3.5 0 0 0-1-6.85A5.5 5.5 0 0 0 2.6 12"/><path d="M13 17.5h6.2a2.8 2.8 0 0 0 .3-5.58"/></svg>
          Vær
        </div>

        <div class="app-key" data-action="app" data-app="youtubemusic://" data-url="https://music.youtube.com">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V6l11-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="17.5" cy="16" r="2.5"/></svg>
          Musikk
        </div>

        <div class="app-key" data-action="link" data-url="tel:">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3 19.5 19.5 0 0 1-6-6 19.8 19.8 0 0 1-3-8.7A2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .3 2 .7 3a2 2 0 0 1-.5 2L8 10a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2-.5c1 .4 2 .6 3 .7a2 2 0 0 1 1.7 2z"/></svg>
          Telefon
        </div>

        <div class="app-key" data-action="link" data-url="sms:">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H8l-5 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
          Meldinger
        </div>

        <div class="app-key" data-action="view" data-view="calc">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="2" width="16" height="20" rx="2.5"/><path d="M8 7h8"/><path d="M8 12h.01M12 12h.01M16 12h.01M8 16h.01M12 16h.01M16 16h.01"/></svg>
          Kalkulator
        </div>
      </div>
    </div>

    <!-- WEATHER VIEW -->
    <div id="view-weather" class="view">
      <div class="subview-header">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="9" r="3.2"/><path d="M13 17.5a3.5 3.5 0 0 0-1-6.85A5.5 5.5 0 0 0 2.6 12"/><path d="M13 17.5h6.2a2.8 2.8 0 0 0 .3-5.58"/></svg>
        <span>Oslo</span>
      </div>
      <div class="weather-big">
        <div class="emoji" id="w-emoji">⛅</div>
        <div class="temp" id="w-temp">--°</div>
        <div class="desc" id="w-desc">henter …</div>
      </div>
      <div class="weather-sub">
        <span id="w-wind">vind --</span>
        <span id="w-updated">--:--</span>
      </div>
    </div>

    <!-- CALCULATOR VIEW -->
    <div id="view-calc" class="view">
      <div class="subview-header">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="2" width="16" height="20" rx="2.5"/><path d="M8 7h8"/></svg>
        <span>Kalkulator</span>
      </div>
      <div class="calc-display" id="calc-display">0</div>
      <div class="calc-grid" id="calc-grid">
        <div class="calc-key op" data-k="C">C</div>
        <div class="calc-key op" data-k="±">±</div>
        <div class="calc-key op" data-k="%">%</div>
        <div class="calc-key op" data-k="÷">÷</div>

        <div class="calc-key" data-k="7">7</div>
        <div class="calc-key" data-k="8">8</div>
        <div class="calc-key" data-k="9">9</div>
        <div class="calc-key op" data-k="×">×</div>

        <div class="calc-key" data-k="4">4</div>
        <div class="calc-key" data-k="5">5</div>
        <div class="calc-key" data-k="6">6</div>
        <div class="calc-key op" data-k="-">−</div>

        <div class="calc-key" data-k="1">1</div>
        <div class="calc-key" data-k="2">2</div>
        <div class="calc-key" data-k="3">3</div>
        <div class="calc-key op" data-k="+">+</div>

        <div class="calc-key wide" data-k="0">0</div>
        <div class="calc-key" data-k=".">.</div>
        <div class="calc-key op" data-k="=">=</div>
      </div>
    </div>

  </div>

  <div class="softkeys">
    <button class="softkey" id="btn-back">Tilbake</button>
    <button class="home-btn" id="btn-home" aria-label="Hjem"></button>
    <span style="width:52px"></span>
  </div>

  <div class="credit">laget med ♡</div>
</div>

<script>
  // ---------- View switching ----------
  const views = {
    home: document.getElementById('view-home'),
    weather: document.getElementById('view-weather'),
    calc: document.getElementById('view-calc'),
  };
  const backBtn = document.getElementById('btn-back');

  function showView(name){
    Object.values(views).forEach(v => v.classList.remove('active'));
    views[name].classList.add('active');
    backBtn.style.visibility = name === 'home' ? 'hidden' : 'visible';
  }
  showView('home');

  document.getElementById('btn-home').addEventListener('click', () => showView('home'));
  backBtn.addEventListener('click', () => showView('home'));

  // Tries the app's own URL scheme first (opens the real app if it's
  // installed). If nothing takes over the screen within ~1.2s, we assume
  // the scheme didn't work and fall back to the website instead.
  function openAppOrWeb(appUrl, webUrl){
    let handedOff = false;
    const onHide = () => { handedOff = true; };
    document.addEventListener('visibilitychange', onHide);
    window.location.href = appUrl;
    setTimeout(() => {
      document.removeEventListener('visibilitychange', onHide);
      if (!handedOff) window.location.href = webUrl;
    }, 1200);
  }

  document.querySelectorAll('.app-key').forEach(key => {
    key.addEventListener('click', () => {
      const action = key.dataset.action;
      if (action === 'link') {
        window.location.href = key.dataset.url;
      } else if (action === 'app') {
        openAppOrWeb(key.dataset.app, key.dataset.url);
      } else if (action === 'view') {
        showView(key.dataset.view);
      }
    });
  });

  // ---------- Clock ----------
  const dayNames = ['søndag','mandag','tirsdag','onsdag','torsdag','fredag','lørdag'];
  const monthNames = ['januar','februar','mars','april','mai','juni','juli','august','september','oktober','november','desember'];

  function pad(n){ return n < 10 ? '0'+n : ''+n; }

  function tick(){
    const now = new Date();
    const timeStr = pad(now.getHours()) + ':' + pad(now.getMinutes());
    document.getElementById('clock-time').textContent = timeStr;
    document.getElementById('status-time').textContent = timeStr;
    document.getElementById('clock-date').textContent =
      dayNames[now.getDay()] + ' ' + now.getDate() + '. ' + monthNames[now.getMonth()];
  }
  tick();
  setInterval(tick, 1000 * 10);

  // ---------- Weather (Open-Meteo, no key needed) ----------
  const OSLO = { lat: 59.9139, lon: 10.7522 };

  function weatherInfo(code){
    if (code === 0) return { emoji:'☀️', desc:'klarvær' };
    if ([1,2].includes(code)) return { emoji:'🌤️', desc:'lettskyet' };
    if (code === 3) return { emoji:'☁️', desc:'overskyet' };
    if ([45,48].includes(code)) return { emoji:'🌫️', desc:'tåke' };
    if ([51,53,55,56,57].includes(code)) return { emoji:'🌦️', desc:'yr' };
    if ([61,63,65,66,67,80,81,82].includes(code)) return { emoji:'🌧️', desc:'regn' };
    if ([71,73,75,77,85,86].includes(code)) return { emoji:'❄️', desc:'snø' };
    if ([95,96,99].includes(code)) return { emoji:'⛈️', desc:'tordenvær' };
    return { emoji:'⛅', desc:'variabelt' };
  }

  async function loadWeather(){
    try {
      const url = `https://api.open-meteo.com/v1/forecast?latitude=${OSLO.lat}&longitude=${OSLO.lon}&current_weather=true&timezone=Europe%2FOslo`;
      const res = await fetch(url);
      const data = await res.json();
      const cw = data.current_weather;
      const info = weatherInfo(cw.weathercode);
      const temp = Math.round(cw.temperature);

      document.getElementById('weather-mini-text').textContent = `Oslo ${temp}°`;
      document.querySelector('#weather-mini .ic').textContent = info.emoji;

      document.getElementById('w-emoji').textContent = info.emoji;
      document.getElementById('w-temp').textContent = temp + '°';
      document.getElementById('w-desc').textContent = info.desc;
      document.getElementById('w-wind').textContent = 'vind ' + Math.round(cw.windspeed) + ' km/t';
      const t = cw.time ? cw.time.slice(11,16) : '';
      document.getElementById('w-updated').textContent = 'kl ' + t;
    } catch (e) {
      document.getElementById('weather-mini-text').textContent = 'Vær utilgjengelig';
      document.getElementById('w-desc').textContent = 'fikk ikke kontakt';
    }
  }
  loadWeather();
  setInterval(loadWeather, 1000 * 60 * 15);

  // ---------- Calculator ----------
  let calcExpr = '';
  let calcJustEvaluated = false;
  const display = document.getElementById('calc-display');

  function opSymbolToJs(s){
    return s.replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-');
  }

  function renderCalc(){
    display.textContent = calcExpr === '' ? '0' : calcExpr;
  }

  document.getElementById('calc-grid').addEventListener('click', (e) => {
    const key = e.target.closest('.calc-key');
    if (!key) return;
    const k = key.dataset.k;

    if (k === 'C') {
      calcExpr = '';
    } else if (k === '±') {
      if (calcExpr) calcExpr = calcExpr.startsWith('-') ? calcExpr.slice(1) : '-' + calcExpr;
    } else if (k === '%') {
      try { calcExpr = String(parseFloat(opSymbolToJs(calcExpr)) / 100); } catch(e){}
    } else if (k === '=') {
      try {
        // eslint-disable-next-line no-eval
        const result = Function('"use strict";return (' + opSymbolToJs(calcExpr) + ')')();
        calcExpr = String(Math.round(result * 1e8) / 1e8);
        calcJustEvaluated = true;
      } catch(e) {
        calcExpr = 'feil';
      }
    } else {
      if (calcJustEvaluated && !isNaN(k)) { calcExpr = ''; }
      calcJustEvaluated = false;
      calcExpr += k;
    }
    renderCalc();
  });
  renderCalc();
</script>

</body>
</html>
